name: Build Boors Tech APK/AAB

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      api_base_url:
        description: 'Backend API base URL'
        required: false
        default: 'https://api.boorstech.ir/v1'
      use_mock_data:
        description: 'Build with mock data (true/false)'
        required: false
        default: 'true'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: takvan_plus
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n || echo "gen-l10n skipped (hand-written fallback in repo is used)"

      - name: Analyze (non-blocking)
        run: flutter analyze || true

      - name: Build release APK
        run: |
          flutter build apk --release \
            --dart-define=API_BASE_URL=${{ github.event.inputs.api_base_url || 'https://api.boorstech.ir/v1' }} \
            --dart-define=USE_MOCK_DATA=${{ github.event.inputs.use_mock_data || 'true' }}

      - name: Build release AAB
        run: |
          flutter build appbundle --release \
            --dart-define=API_BASE_URL=${{ github.event.inputs.api_base_url || 'https://api.boorstech.ir/v1' }} \
            --dart-define=USE_MOCK_DATA=${{ github.event.inputs.use_mock_data || 'true' }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: boors-tech-release-apk
          path: takvan_plus/build/app/outputs/flutter-apk/app-release.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: boors-tech-release-aab
          path: takvan_plus/build/app/outputs/bundle/release/app-release.aab
